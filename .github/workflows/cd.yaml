name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  promote-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: OnyiGlobal2025/taskflow-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update dev image tags
        run: |
          BACKEND_TAG="backend-${{ github.event.workflow_run.head_sha }}"
          FRONTEND_TAG="frontend-${{ github.event.workflow_run.head_sha }}"
          sed -i "s|tag: \"backend-.*\"|tag: \"${BACKEND_TAG}\"|" envs/dev/values.yaml
          sed -i "s|tag: \"frontend-.*\"|tag: \"${FRONTEND_TAG}\"|" envs/dev/values.yaml
          git config user.email "ci@taskflow.com"
          git config user.name "CI Bot"
          git add envs/dev/values.yaml
          git commit -m "chore: promote ${{ github.event.workflow_run.head_sha }} to dev"
          git push

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: cd-rollback-dev

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name taskflow-eks-cluster --region ${{ secrets.AWS_REGION }}

      - name: Wait for ArgoCD to sync
        run: sleep 90

      - name: Verify rollout health
        id: health
        run: |
          set +e
          kubectl rollout status deployment/taskflow-backend -n taskflow-dev --timeout=120s
          BACKEND_OK=$?
          kubectl rollout status deployment/taskflow-frontend -n taskflow-dev --timeout=120s
          FRONTEND_OK=$?
          if [ $BACKEND_OK -ne 0 ] || [ $FRONTEND_OK -ne 0 ]; then
            echo "healthy=false" >> $GITHUB_OUTPUT
          else
            echo "healthy=true" >> $GITHUB_OUTPUT
          fi

      - name: Rollback on failure
        if: steps.health.outputs.healthy == 'false'
        run: |
          git revert --no-edit HEAD
          git push
          echo "Rollback triggered: reverted promotion to dev"

      - name: Notify Slack rollback
        if: steps.health.outputs.healthy == 'false'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": ":rotating_light: *Dev rollback triggered*\nDeployment failed health check, reverted to previous version.\nCommit: ${{ github.event.workflow_run.head_sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Fail job if rolled back
        if: steps.health.outputs.healthy == 'false'
        run: exit 1

  promote-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: promote-dev
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: OnyiGlobal2025/taskflow-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update staging image tags
        run: |
          BACKEND_TAG="backend-${{ github.event.workflow_run.head_sha }}"
          FRONTEND_TAG="frontend-${{ github.event.workflow_run.head_sha }}"
          sed -i "s|tag: \"backend-.*\"|tag: \"${BACKEND_TAG}\"|" envs/staging/values.yaml
          sed -i "s|tag: \"frontend-.*\"|tag: \"${FRONTEND_TAG}\"|" envs/staging/values.yaml
          git config user.email "ci@taskflow.com"
          git config user.name "CI Bot"
          git add envs/staging/values.yaml
          git commit -m "chore: promote ${{ github.event.workflow_run.head_sha }} to staging"
          git push

      - name: Notify Slack staging deployed
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": ":rocket: *Staging deployed*\nCommit: ${{ github.event.workflow_run.head_sha }}\nActor: ${{ github.actor }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  approve-prod:
    name: Await production approval
    runs-on: ubuntu-latest
    needs: promote-staging
    environment: production
    steps:
      - name: Notify Slack approval needed
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": ":hourglass: *Production approval needed*\nApprove here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Approval granted
        run: echo "Production deployment approved"

  promote-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: approve-prod
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: OnyiGlobal2025/taskflow-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update prod image tags
        run: |
          BACKEND_TAG="backend-${{ github.event.workflow_run.head_sha }}"
          FRONTEND_TAG="frontend-${{ github.event.workflow_run.head_sha }}"
          sed -i "s|tag: \"backend-.*\"|tag: \"${BACKEND_TAG}\"|" envs/prod/values.yaml
          sed -i "s|tag: \"frontend-.*\"|tag: \"${FRONTEND_TAG}\"|" envs/prod/values.yaml
          git config user.email "ci@taskflow.com"
          git config user.name "CI Bot"
          git add envs/prod/values.yaml
          git commit -m "chore: promote ${{ github.event.workflow_run.head_sha }} to prod"
          git push

      - name: Notify Slack prod deployed
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text": ":white_check_mark: *Production deployed*\nTag: ${{ github.event.workflow_run.head_sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true