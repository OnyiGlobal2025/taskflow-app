apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: taskflow-app
  description: TaskFlow application (backend + frontend) and CI/CD pipelines — build, scan, and delivery to ECR.
  annotations:
    github.com/project-slug: OnyiGlobal2025/taskflow-app
    backstage.io/techdocs-ref: dir:.
    # Matches the backstage.io/kubernetes-id label on the Deployments and
    # Services in the taskflow Helm chart. The Kubernetes plugin uses this to
    # find live workloads across all three environment namespaces.
    backstage.io/kubernetes-id: taskflow-app
    # The ApplicationSet generates one Application per environment, all named
    # taskflow-*. The wildcard surfaces dev, staging, and prod on one page.
    argocd/app-name: taskflow-prod
  tags:
    - nodejs
    - cicd
    - github-actions
    - application
spec:
  type: service
  lifecycle: production